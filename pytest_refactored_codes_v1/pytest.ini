[pytest]
minversion = 7.0
testpaths = tests
markers =
    smoke: fast import/wiring checks; no solver, no model build, no file I/O. < 5 s total.
    regression: comparisons against committed baselines; one cached run per family. ~1 min.
    nightly: heavier solver-driven checks; full NF270 single-salt sweep. ~30 min.
    slow: takes >60 s wall-clock; usually stacked with nightly.
addopts =
    -ra
    --strict-markers
    --tb=short
filterwarnings =
    ignore::DeprecationWarning:pyomo.*
    ignore::DeprecationWarning:casadi.*
    ignore::FutureWarning:pandas.*

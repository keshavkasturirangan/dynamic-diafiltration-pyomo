name: nightly-validation

on:
  schedule:
    - cron: "0 08 * * *"
  workflow_dispatch:

jobs:
  validation-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pillow pytest opencv-python-headless

      - name: Nightly validation pytests
        run: |
          pytest -q UnifiedFramework/DATA3/tests/regression/test_nightly_validation_assets.py -m "nightly and not slow"

      - name: Figure validation pytests
        run: |
          pytest -q UnifiedFramework/DATA3/tests/regression/test_simulation_validation_figures.py -m "nightly"

      - name: Digitized panel comparison (report)
        run: |
          python UnifiedFramework/DATA3/scripts/validation/nightly/compare_digitized_baselines.py \
            --repo-root . \
            --manifest UnifiedFramework/DATA3/docs/validation/nightly/digitized_baselines/manifest.csv \
            --thresholds UnifiedFramework/DATA3/docs/validation/nightly/digitized_baselines/thresholds.csv \
            --out-csv UnifiedFramework/DATA3/docs/validation/nightly/digitized_baselines/comparison_latest.csv

      - name: Storage-aware prune dry-run
        run: |
          python UnifiedFramework/DATA3/scripts/reproduce/prune_reproduction_artifacts.py \
            --repo-root . \
            --keep-full 3 \
            --mode archive
